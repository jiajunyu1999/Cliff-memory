[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcgam-molecular-cliffs"
version = "0.1.0"
description = "Lightweight action-centered molecular activity cliff benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "rdkit>=2023.9",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "pyyaml>=6.0",
  "python-Levenshtein>=0.21",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
